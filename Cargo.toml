[package]
name = "tmacs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "7.0.0"
libc = "0.2.191"
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
toml = "1.2.1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2.3"
