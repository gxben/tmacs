name: Trigger Release

# Manual trigger: semantic-release computes the next version from the
# Conventional Commits since the last tag, bumps Cargo.toml/Cargo.lock,
# updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub release. The
# binaries are then built for macOS and Linux (amd64/arm64), attached to
# the release, and the Homebrew formula is pushed to the tap.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install \
            @semantic-release/changelog@7.0.0 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@11.0.1 \
            conventional-changelog-conventionalcommits@10.4.1

      # Optional: a GitHub App token lets the release commit bypass branch
      # protection. Without it, GITHUB_TOKEN is used.
      - name: Create Github App token
        id: app-token
        if: vars.RELEASE_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: semantic
        with:
          semantic_version: 25.0.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            echo "Released v${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no feat/fix/perf/chore commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    if: needs.release.outputs.new_release_published == 'true'
    needs: release
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low for older distros.
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: macos-26-intel
            os: darwin
            arch: amd64
          - runner: macos-26
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release archive
        run: make package
      - name: Check archive name
        run: |
          f="dist/tmacs_${{ needs.release.outputs.new_release_version }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          test -f "$f" || { ls dist; exit 1; }
          tar xzf "$f" -C "$RUNNER_TEMP" && "$RUNNER_TEMP/tmacs" --version
      - uses: actions/upload-artifact@v7
        with:
          name: tmacs-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  assets:
    if: needs.release.outputs.new_release_published == 'true'
    needs: [release, build]
    name: Upload release assets
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.new_release_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum tmacs_${VERSION}_*.tar.gz > tmacs_${VERSION}_SHA256SUMS
          cat tmacs_${VERSION}_SHA256SUMS
      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist/*.tar.gz
            dist/*_SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/*_SHA256SUMS

  homebrew:
    if: needs.release.outputs.new_release_published == 'true'
    needs: [release, assets]
    name: Homebrew formula
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.new_release_version }}
      # Tap repository; defaults to <owner>/homebrew-tap.
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || format('{0}/homebrew-tap', github.repository_owner) }}
      TAP_TOKEN: ${{ secrets.PAT_HOMEBREW_TAP_RELEASER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: actions/download-artifact@v8
        with:
          name: checksums
          path: dist
      - name: Build Homebrew formula
        run: |
          scripts/homebrew-formula.sh "$VERSION" "$GITHUB_REPOSITORY" \
            "dist/tmacs_${VERSION}_SHA256SUMS" > tmacs.rb
          cat tmacs.rb
          ruby -c tmacs.rb
      - name: Push formula to Homebrew tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::PAT_HOMEBREW_TAP_RELEASER is not set; formula not published"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula
          mv ../tmacs.rb Formula/tmacs.rb
          git add Formula/tmacs.rb
          git commit -m "tmacs ${VERSION}"
          git push origin HEAD
