name: Security Checks

on:
  push:
    branches: main
    paths:
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches: main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      # Code scanning (SARIF upload) needs a public repository or GitHub
      # Advanced Security; on a private repository the results are kept as
      # a workflow artifact instead.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - uses: actions/upload-artifact@v7
        if: github.event.repository.private
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results
